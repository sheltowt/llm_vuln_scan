name: ci
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      # Coverage floor lives in pyproject.toml ([tool.coverage.report] fail_under).
      - run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    # A plain (non-editable) install and wheel build, since the editable
    # hatchling install is the one that has been flaky.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Smoke-test the installed wheel
        working-directory: /tmp
        run: |
          lvscan version
          lvscan list vulnerability

  demo-scan:
    # Dogfood: run the scanner against the bundled intentionally-vulnerable
    # fixture. The fixture fails every check, so the scan itself has no gate;
    # check_demo_scan.py asserts the planted weaknesses were actually found and
    # that the SARIF/JUnit outputs are valid and agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Scan the fixture app
        run: |
          lvscan run -c examples/quickstart/lvscan.yaml -q \
            --junit demo-junit.xml --sarif demo.sarif --html demo-report.html
      - name: Check the scan found the planted weaknesses
        run: python scripts/check_demo_scan.py demo-junit.xml demo.sarif
      - name: Upload scan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-scan-outputs
          path: |
            demo-junit.xml
            demo.sarif
            demo-report.html
          if-no-files-found: warn
