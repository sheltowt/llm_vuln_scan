name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  demo-scan:
    # Dogfood: run the scanner against the bundled intentionally-vulnerable
    # fixture to prove the CLI works end to end in CI. No gate, because the
    # fixture is meant to fail every check; this proves execution, not safety.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scan the fixture app
        run: |
          lvscan run -c examples/quickstart/lvscan.yaml \
            --junit demo-junit.xml --sarif demo.sarif --html demo-report.html
      - name: Upload scan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-scan-outputs
          path: |
            demo-junit.xml
            demo.sarif
            demo-report.html
          if-no-files-found: warn
