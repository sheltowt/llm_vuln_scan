# TEMPLATE — copy this into .github/workflows/ of a downstream repo that has an
# lvscan.yaml and a committed lvscan.suite.yaml. It is kept here (not under
# .github/workflows/) so it does not run in this repo, where the package is not
# yet on PyPI and there is no root lvscan.yaml.
name: llm-vuln-scan
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install llm-vuln-scan
      - name: Run static-tier scan
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          lvscan run \
            --suite lvscan.suite.yaml \
            --fail-on-severity high \
            --sarif lvscan.sarif \
            --junit lvscan-junit.xml
      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lvscan.sarif
